<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Unfollowers Tracker</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #0095f6;
            --primary-hover: #0077c5;
            --text-main: #262626;
            --border: #dbdbdb;
            --danger: #ed4956;
            --success: #28a745;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        h1, h2 { text-align: center; margin-top: 0; }
        .upload-group { margin-bottom: 20px; font-weight: bold;}
        input[type="file"] {
            display: block; width: 100%; padding: 10px; border: 1px dashed var(--primary);
            border-radius: 4px; background-color: #f9f9f9; margin-top: 8px;
        }
        button {
            background-color: var(--primary); color: white; border: none; padding: 12px 20px;
            width: 100%; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer;
        }
        button:hover { background-color: var(--primary-hover); }
        .stats { display: flex; justify-content: space-around; text-align: center; margin-bottom: 20px;}
        .stat-box { background: #f9f9f9; padding: 15px; border-radius: 8px; width: 30%; border: 1px solid var(--border); }
        .stat-box span { display: block; font-size: 24px; font-weight: bold; color: var(--primary); }
        
        select {
            width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border);
            font-size: 16px; margin-bottom: 15px; font-weight: bold; background: #fafafa;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #f9f9f9; }
        a { color: var(--primary); text-decoration: none; }
        a:hover { text-decoration: underline; }
        #results, #warningMessage { display: none; }
        #warningMessage { background-color: #ffeaea; color: var(--danger); padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ffc2c2;}
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Cek Unfollowers Instagram</h1>
        <p style="text-align: center;">Pilih file JSON dari hasil download data Instagram Anda.</p>
        
        <div id="warningMessage"></div>

        <div class="upload-group">
            <label>1. Upload File Followers (Pengikut)</label>
            <input type="file" id="followersFile" accept=".json">
        </div>

        <div class="upload-group">
            <label>2. Upload File Following (Mengikuti)</label>
            <input type="file" id="followingFile" accept=".json">
        </div>

        <button id="analyzeBtn">Analisis Sekarang</button>
    </div>

    <div class="card" id="results">
        <h2>Hasil Analisis</h2>
        
        <div class="stats">
            <div class="stat-box">Mengikuti <span id="followingCount">0</span></div>
            <div class="stat-box">Pengikut <span id="followersCount">0</span></div>
            <div class="stat-box" style="border-color: var(--danger);">Tidak Follback <span id="unfollowersCount" style="color: var(--danger);">0</span></div>
        </div>

        <select id="viewFilter">
            <option value="notFollback">Kategori: ❌ Tidak Follback (Kamu follow, dia tidak)</option>
            <option value="mutual">Kategori: 🤝 Saling Follow (Mutuals)</option>
            <option value="fans">Kategori: 🌟 Fans (Dia follow, kamu tidak)</option>
        </select>

        <table id="resultTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Username</th>
                    <th>Link Profil</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    // Menyaring HANYA Username Asli Instagram
    function extractUsernames(data) {
        let usernamesMap = new Map(); // Menyimpan username lowercase sebagai key, dan nama asli sebagai value
        
        function traverse(obj) {
            if (Array.isArray(obj)) {
                obj.forEach(traverse);
            } else if (obj !== null && typeof obj === 'object') {
                if (obj.string_list_data && Array.isArray(obj.string_list_data)) {
                    obj.string_list_data.forEach(item => {
                        if (item.value && typeof item.value === 'string') {
                            let uname = item.value.trim();
                            if (uname !== '' && uname !== '_u') usernamesMap.set(uname.toLowerCase(), uname);
                        }
                    });
                } else if (obj.href && obj.value && typeof obj.value === 'string' && obj.href.includes('instagram.com')) {
                    let uname = obj.value.trim();
                    if (uname !== '' && uname !== '_u') usernamesMap.set(uname.toLowerCase(), uname);
                }
                Object.values(obj).forEach(traverse);
            }
        }
        traverse(data);
        return usernamesMap;
    }

    function readFileAsJSON(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                try { resolve(JSON.parse(e.target.result)); } 
                catch (err) { reject("File JSON rusak atau tidak valid."); }
            };
            reader.readAsText(file);
        });
    }

    let globalNotFollback = [];
    let globalMutuals = [];
    let globalFans = [];

    function renderTable(dataArray) {
        const tbody = document.querySelector('#resultTable tbody');
        tbody.innerHTML = ''; 
        if(dataArray.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Tidak ada data di kategori ini.</td></tr>';
            return;
        }
        dataArray.forEach((username, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${index + 1}</td>
                            <td><b>${username}</b></td>
                            <td><a href="https://www.instagram.com/${username}" target="_blank">Buka Profil &rarr;</a></td>`;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('viewFilter').addEventListener('change', (e) => {
        if(e.target.value === 'notFollback') renderTable(globalNotFollback);
        if(e.target.value === 'mutual') renderTable(globalMutuals);
        if(e.target.value === 'fans') renderTable(globalFans);
    });

    document.getElementById('analyzeBtn').addEventListener('click', async () => {
        const followersInput = document.getElementById('followersFile').files[0];
        const followingInput = document.getElementById('followingFile').files[0];
        const warningDiv = document.getElementById('warningMessage');
        warningDiv.style.display = 'none';

        if (!followersInput || !followingInput) return alert('Mohon upload kedua file JSON.');

        const btn = document.getElementById('analyzeBtn');
        btn.innerText = 'Memproses...'; btn.disabled = true;

        try {
            const followersData = await readFileAsJSON(followersInput);
            const followingData = await readFileAsJSON(followingInput);

            // Ekstrak dalam format Map() agar huruf besar/kecil tidak jadi masalah
            const followersMap = extractUsernames(followersData);
            const followingMap = extractUsernames(followingData);

            if (followingMap.size === 0) {
                 warningDiv.innerHTML = "⚠️ <b>PERHATIAN:</b> Angka 'Mengikuti' adalah 0. Ini berarti file <code>following.json</code> dari Instagram Anda benar-benar kosong/corrupt. Solusinya: Anda harus meminta ulang download data dari Instagram Anda.";
                 warningDiv.style.display = 'block';
            }

            globalNotFollback = [];
            globalMutuals = [];
            globalFans = [];

            // Cek Saling Follow & Tidak Follback
            followingMap.forEach((originalName, lowerName) => {
                if (followersMap.has(lowerName)) {
                    globalMutuals.push(originalName);
                } else {
                    globalNotFollback.push(originalName);
                }
            });

            // Cek Fans (Dia follow kita, kita tidak follback)
            followersMap.forEach((originalName, lowerName) => {
                if (!followingMap.has(lowerName)) {
                    globalFans.push(originalName);
                }
            });

            document.getElementById('followersCount').innerText = followersMap.size;
            document.getElementById('followingCount').innerText = followingMap.size;
            document.getElementById('unfollowersCount').innerText = globalNotFollback.length;

            document.getElementById('viewFilter').value = 'notFollback';
            renderTable(globalNotFollback);

            document.getElementById('results').style.display = 'block';
            btn.innerText = 'Analisis Selesai (Ulangi)';
            btn.disabled = false;

        } catch (error) {
            alert('Terjadi kesalahan: ' + error);
            btn.innerText = 'Analisis Sekarang'; btn.disabled = false;
        }
    });
</script>
</body>
</html>
