<!DOCTYPE html>
<html lang="id" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemendek URL Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        // Cek preferensi tema saat load untuk mencegah flash
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        /* Custom scrollbar untuk tampilan lebih rapi */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 min-h-screen flex flex-col font-sans transition-colors duration-300 selection:bg-indigo-500 selection:text-white">

    <!-- Header dengan Logo dan Toggle Tema -->
    <header class="w-full max-w-4xl mx-auto p-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
            <span class="text-xl font-bold tracking-tight">Kecilin<span class="text-indigo-600 dark:text-indigo-400">URL</span></span>
        </div>
        
        <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-full text-sm p-2.5 transition-all">
            <!-- Icon Matahari (Light Mode) -->
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 3.22a1 1 0 011.415 0l.707.707a1 1 0 01-1.414 1.414l-.707-.707a1 1 0 010-1.414zM17 10a1 1 0 011 1h1a1 1 0 110-2h-1a1 1 0 01-1 1zm-3.22 4.22a1 1 0 010 1.415l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-3.22a1 1 0 01-1.415 0l-.707-.707a1 1 0 011.414-1.414l.707.707a1 1 0 010 1.414zM3 10a1 1 0 01-1-1H1a1 1 0 110 2h1a1 1 0 011-1zm3.22-4.22a1 1 0 010-1.415l.707-.707a1 1 0 011.414 1.414l-.707.707a1 1 0 01-1.414 0zM10 5a5 5 0 100 10 5 5 0 000-10z"></path></svg>
            <!-- Icon Bulan (Dark Mode) -->
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-2xl mx-auto">
        <div class="text-center mb-10 w-full">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-600">
                Pendekkan URL Anda
            </h1>
            <p class="text-gray-500 dark:text-gray-400 text-lg max-w-md mx-auto">
                Buat tautan panjang menjadi singkat dan mudah dibagikan hanya dengan satu klik.
            </p>
        </div>

        <div class="w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700 p-6 md:p-8 transition-all relative overflow-hidden">
            <!-- Dekorasi background -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 rounded-full bg-indigo-500/10 blur-2xl"></div>
            <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 rounded-full bg-purple-500/10 blur-2xl"></div>
            
            <form id="url-form" class="relative z-10 space-y-4">
                <div>
                    <label for="long-url" class="block text-sm font-medium mb-2 text-gray-700 dark:text-gray-300">Masukkan tautan panjang di sini</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        </div>
                        <input type="url" id="long-url" required placeholder="https://contoh.com/artikel-sangat-panjang..." 
                            class="block w-full pl-10 pr-4 py-4 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none"
                            autocomplete="off">
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-4 px-6 rounded-xl transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 group">
                    <span id="btn-text">Pendekkan Sekarang</span>
                    <svg id="btn-icon" class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    
                    <!-- Loading Spinner (Hidden by default) -->
                    <svg id="btn-spinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>

            <!-- Pesan Error -->
            <div id="error-msg" class="hidden mt-4 p-4 text-sm text-red-800 rounded-xl bg-red-50 dark:bg-red-900/20 dark:text-red-400 border border-red-200 dark:border-red-800/30 transition-all">
                Terjadi kesalahan. Pastikan URL valid atau coba lagi nanti.
            </div>

            <!-- Hasil URL -->
            <div id="result-box" class="hidden mt-6 pt-6 border-t border-gray-100 dark:border-gray-700 animate-[fadeIn_0.5s_ease-out]">
                <p class="text-sm font-medium mb-2 text-gray-500 dark:text-gray-400">Tautan Berhasil Dipendekkan 🎉</p>
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="flex-grow relative">
                        <input type="text" id="short-url" readonly 
                            class="block w-full px-4 py-3 bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-100 dark:border-indigo-800/50 rounded-xl text-indigo-700 dark:text-indigo-300 font-medium outline-none cursor-text">
                    </div>
                    <button id="copy-btn" type="button" class="flex-shrink-0 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 border border-gray-200 dark:border-gray-600 text-gray-700 dark:text-gray-200 font-medium py-3 px-5 rounded-xl transition-all flex items-center justify-center gap-2">
                        <svg id="copy-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        <svg id="check-icon" class="hidden w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        <span id="copy-text">Salin</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Badge informasi API -->
        <div class="mt-8 text-center text-xs text-gray-400 dark:text-gray-500">
            Powered by is.gd API &bull; No registration required
        </div>
    </main>

    <footer class="w-full text-center p-6 text-sm text-gray-500 dark:text-gray-400">
        <p>&copy; <span id="year"></span> KecilinURL. Dibuat untuk GitHub Pages.</p>
    </footer>

    <script>
        // Set tahun footer otomatis
        document.getElementById('year').textContent = new Date().getFullYear();

        // ---- LOGIKA THEME TOGGLE (DARK/LIGHT) ----
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        // Ubah icon berdasarkan tema saat ini
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            // Toggle icons
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            // Jika sebelumnya diset di localstorage
            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            // Jika belum ada di localstorage (ikut sistem)
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });


        // ---- LOGIKA FORM & API PEMENDEK URL ----
        const form = document.getElementById('url-form');
        const longUrlInput = document.getElementById('long-url');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const btnSpinner = document.getElementById('btn-spinner');
        
        const resultBox = document.getElementById('result-box');
        const shortUrlInput = document.getElementById('short-url');
        const errorMsg = document.getElementById('error-msg');
        
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const copyIcon = document.getElementById('copy-icon');
        const checkIcon = document.getElementById('check-icon');

        // Menggunakan API gratis dari is.gd dengan metode JSONP
        // Metode ini digunakan untuk melewati pemblokiran CORS oleh browser
        function shortenUrl(originalUrl) {
            return new Promise((resolve, reject) => {
                // 1. Buat nama fungsi callback yang unik
                const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
                
                // 2. Buat elemen tag <script> baru
                const script = document.createElement('script');
                
                // 3. Daftarkan fungsi callback ke global window
                window[callbackName] = function(data) {
                    // Bersihkan jejak script setelah selesai
                    delete window[callbackName];
                    document.body.removeChild(script);
                    
                    // Cek apakah API mengembalikan shorturl atau error
                    if (data.shorturl) {
                        resolve(data.shorturl);
                    } else {
                        reject(new Error(data.errormessage || 'Gagal memendekkan URL'));
                    }
                };
                
                // 4. Tangani error jika koneksi gagal
                script.onerror = function() {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    reject(new Error('Koneksi jaringan gagal atau diblokir.'));
                };
                
                // 5. Eksekusi request dengan memasukkan tag script ke dalam body HTML
                script.src = `https://is.gd/create.php?format=json&url=${encodeURIComponent(originalUrl)}&callback=${callbackName}`;
                document.body.appendChild(script);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const urlToShorten = longUrlInput.value.trim();
            
            if(!urlToShorten) return;

            // State: Sedang loading
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'Memproses...';
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');
            resultBox.classList.add('hidden');
            errorMsg.classList.add('hidden');

            try {
                // Panggil fungsi API
                const shortened = await shortenUrl(urlToShorten);
                
                // Jika sukses
                shortUrlInput.value = shortened;
                resultBox.classList.remove('hidden');
                
                // Reset state copy button jika sebelumnya sudah diklik
                resetCopyButton();
                
            } catch (err) {
                // Jika error
                errorMsg.classList.remove('hidden');
                errorMsg.textContent = "Gagal memendekkan tautan. Pastikan URL valid atau coba lagi nanti.";
            } finally {
                // Kembalikan ke state semula
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.textContent = 'Pendekkan Sekarang';
                btnIcon.classList.remove('hidden');
                btnSpinner.classList.add('hidden');
            }
        });


        // ---- LOGIKA TOMBOL SALIN (COPY TO CLIPBOARD) ----
        copyBtn.addEventListener('click', () => {
            if(!shortUrlInput.value) return;

            // Menyalin teks menggunakan API modern
            navigator.clipboard.writeText(shortUrlInput.value).then(() => {
                // Ubah tampilan tombol menjadi sukses
                copyIcon.classList.add('hidden');
                checkIcon.classList.remove('hidden');
                copyText.textContent = 'Tersalin!';
                copyBtn.classList.add('border-green-500', 'text-green-600', 'dark:text-green-400');
                
                // Kembalikan ke tampilan semula setelah 2.5 detik
                setTimeout(resetCopyButton, 2500);
            }).catch(err => {
                console.error('Gagal menyalin teks: ', err);
                // Fallback untuk browser lawas
                shortUrlInput.select();
                document.execCommand('copy');
            });
        });

        function resetCopyButton() {
            copyIcon.classList.remove('hidden');
            checkIcon.classList.add('hidden');
            copyText.textContent = 'Salin';
            copyBtn.classList.remove('border-green-500', 'text-green-600', 'dark:text-green-400');
        }

        // Animasi fade in untuk hasil
        tailwind.config.theme.extend.keyframes = {
            fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
            }
        };
    </script>
</body>
</html>
