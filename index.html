<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Site Under Construction</title>
<style>
:root{
--bg:#070b16;--text:#fff;--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.12);
--accent:#6d5cff;
}
body.light{
--bg:#eef3fb;--text:#111;--glass:rgba(255,255,255,.65);--border:rgba(255,255,255,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:system-ui;background:var(--bg);color:var(--text);overflow-x:hidden;transition:.4s}
#bg{position:fixed;inset:0;overflow:hidden;z-index:-2}
.blob{position:absolute;width:45vw;height:45vw;border-radius:50%;filter:blur(90px);opacity:.4;animation:move 22s ease-in-out infinite alternate}
.b1{background:#6d5cff;left:-10%;top:-10%}.b2{background:#00d9ff;right:-10%;top:10%}.b3{background:#ff3ca6;left:20%;bottom:-10%}
@keyframes move{to{transform:translate(120px,-90px) scale(1.2)}}
canvas{position:fixed;inset:0;pointer-events:none;z-index:-1}
.toggle,#topBtn{position:fixed;right:20px;width:56px;height:56px;border-radius:50%;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(18px);display:grid;place-items:center;cursor:pointer;color:var(--text);transition:.3s}
.toggle{top:20px}
#topBtn{bottom:20px;opacity:0;pointer-events:none}
#topBtn.show{opacity:1;pointer-events:auto}
section{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px}
.card{max-width:900px;width:100%;padding:50px;border-radius:30px;background:var(--glass);backdrop-filter:blur(25px);border:1px solid var(--border);text-align:center}
h1{font-size:clamp(2.8rem,8vw,5.6rem);background:linear-gradient(90deg,#ff4d9d,#7b61ff,#35d7ff,#90ff64,#ff4d9d);background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:rain 8s linear infinite}
@keyframes rain{to{background-position:300%}}
.btn{margin-top:20px;padding:14px 28px;border:none;border-radius:999px;background:linear-gradient(90deg,#6d5cff,#ff3ca6);color:#fff;font-weight:700;cursor:pointer}
.rocket{width:72px;margin:35px auto 0;cursor:pointer;animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(10px)}}
.launch{animation:launch .8s forwards}
@keyframes launch{100%{transform:translateY(180px);opacity:0}}
.info{opacity:0;transform:translateY(50px);transition:1s}.info.show{opacity:1;transform:none}
.socials{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-top:25px}
.social{display:flex;align-items:center;gap:12px;padding:15px;border-radius:16px;background:rgba(255,255,255,.05);text-decoration:none;color:var(--text);transition:.25s}
.social:hover{transform:translateY(-4px);box-shadow:0 0 20px rgba(120,100,255,.4)}
.icon{width:22px;height:22px;fill:currentColor}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="c"></canvas>
<button class="toggle" id="theme">☼</button>
<section>
<div class="card">
<h1 id="title"></h1>
<p>Building something amazing. We'll be back soon.</p>
<button class="btn" id="more">More Information</button>
<div class="rocket" id="down">
<svg viewBox="0 0 64 64" width="72">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#35d7ff"/><stop offset="1" stop-color="#b24cff"/></linearGradient></defs>
<path fill="url(#g)" d="M32 3C42 10 48 22 48 34L56 42L49 49L41 41C29 41 18 34 13 22Z"/>
<circle cx="35" cy="19" r="4" fill="#fff"/><path fill="#ff9b00" d="M29 43L35 43L32 60Z"/>
</svg>
</div>
</div>
</section>

<section id="contact">
<div class="card info" id="info">
<h2>Contact</h2>
<div class="socials">
<a class="social" href="mailto:your@email.com"><svg class="icon" viewBox="0 0 24 24"><path d="M2 4h20v16H2zm2 2v.5L12 13l8-6.5V6"/></svg>Email</a>
<a class="social" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm5 4.5A5.5 5.5 0 1017.5 12 5.5 5.5 0 0012 6.5zm6-.8a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z"/></svg>Instagram</a>
<a class="social" href="#"><strong>X</strong> Twitter</a>
<a class="social" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M13 22v-8h3l1-4h-4V8c0-1.2.4-2 2-2h2V2.3A22 22 0 0014.3 2C11 2 9 4 9 7.7V10H6v4h3v8"/></svg>Facebook</a>
<a class="social" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M9 18l-.4 5 3.8-3.2 5.7 4.2L22 2 2 10l5.5 2.1L18.7 5"/></svg>Telegram</a>
<a class="social" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M12 .5C5.6.5.5 5.7.5 12.1a11.6 11.6 0 007.9 11l.6-.1v-2.4c-3.2.7-3.9-1.4-3.9-1.4-.5-1.4-1.3-1.8-1.3-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1 2.1.7 2.7-1 .2-.7.5-1.2.9-1.5-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.4 1.2-3.3-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.4 1.2a11.4 11.4 0 016.2 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.2 3.1.8.9 1.2 2 1.2 3.3 0 4.4-2.7 5.4-5.3 5.7.5.5.9 1.3.9 2.6V23l.6.1a11.6 11.6 0 007.9-11C23.5 5.7 18.4.5 12 .5z"/></svg>GitHub</a>
</div>
</div>
</section>
<button id="topBtn">↑</button>
<script>
const t="SITE UNDER CONSTRUCTION";let i=0;function s(){title.textContent=t.slice(0,i)+Array.from({length:t.length-i},()=>String.fromCharCode(65+Math.random()*26)).join("");if(i<=t.length){i++;setTimeout(s,40)}else title.textContent=t}s();
theme.onclick=()=>document.body.classList.toggle("light");
function go(){down.classList.add("launch");setTimeout(()=>{scrollTo({top:contact.offsetTop,behavior:"smooth"});down.classList.remove("launch")},400)}
more.onclick=go;down.onclick=go;
new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&info.classList.add("show"))).observe(info);
onscroll=()=>topBtn.classList.toggle("show",scrollY>300);
topBtn.onclick=()=>scrollTo({top:0,behavior:"smooth"});
const c=document.getElementById("c"),ctx=c.getContext("2d");function rs(){c.width=innerWidth;c.height=innerHeight}rs();onresize=rs;let pts=[...Array(70)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5),vy:(Math.random()-.5),r:Math.random()*2+1}));let mx=0,my=0;onmousemove=e=>{mx=e.clientX;my=e.clientY};ontouchmove=e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY};
(function a(){ctx.clearRect(0,0,c.width,c.height);for(let p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;let d=Math.hypot(mx-p.x,my-p.y);if(d<120){p.x-=(mx-p.x)*.003;p.y-=(my-p.y)*.003}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle="#fff";ctx.shadowBlur=10;ctx.shadowColor="#7cf";ctx.fill()}requestAnimationFrame(a)})();
</script>
</body></html>
