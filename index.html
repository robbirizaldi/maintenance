<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#080b12;
    --card:rgba(255,255,255,0.08);
    --text:#ffffff;
}

body.light{
    --bg:#f4f4f4;
    --card:rgba(255,255,255,0.7);
    --text:#111;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:Poppins,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:0.4s;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#5b6cff;
    filter:blur(180px);
    top:-100px;
    left:-100px;
    opacity:.3;
}

body::after{
    content:'';
    position:fixed;
    width:500px;
    height:500px;
    background:#ff3cac;
    filter:blur(180px);
    bottom:-100px;
    right:-100px;
    opacity:.3;
}

.toggle{
    position:fixed;
    top:20px;
    right:20px;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:var(--card);
    backdrop-filter:blur(20px);
    color:var(--text);
    cursor:pointer;
    font-size:22px;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.title{
    font-size:4rem;
    font-weight:700;
    background:linear-gradient(
        90deg,
        #ff0080,
        #7928ca,
        #2afadf,
        #ffcc00,
        #ff0080
    );
    background-size:300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:rainbow 8s linear infinite;
    filter:drop-shadow(0 0 20px rgba(255,255,255,.3));
}

@keyframes rainbow{
    0%{background-position:0%;}
    100%{background-position:300%;}
}

.subtitle{
    margin-top:20px;
    font-size:1.1rem;
    opacity:.8;
}

.card{
    margin-top:40px;
    padding:20px 30px;
    background:var(--card);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    backdrop-filter:blur(20px);
}

.button{
    margin-top:30px;
    padding:14px 30px;
    border:none;
    border-radius:50px;
    font-size:16px;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#6a5cff,#ff4ecd);
    box-shadow:0 0 30px rgba(255,0,200,.4);
}

.more{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.info{
    max-width:500px;
    text-align:center;
    padding:40px;
    border-radius:30px;
    background:var(--card);
    backdrop-filter:blur(20px);
}

.info h2{
    margin-bottom:20px;
}

.info p{
    margin:10px 0;
}

a{
    color:#67a8ff;
    text-decoration:none;
}

.arrow{
    position:absolute;
    bottom:30px;
    font-size:30px;
    animation:float 2s infinite;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(10px);
    }
}

@media(max-width:700px){
    .title{
        font-size:2.5rem;
    }
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<section class="hero">

    <div class="card">
        <h1 class="title">
            Site Under Construction
        </h1>

        <p class="subtitle">
            We're building something amazing.<br>
            Please come back soon.
        </p>

        <button class="button"
        onclick="document.getElementById('info').scrollIntoView()">
            More Info
        </button>
    </div>

    <div class="arrow">
        ↓
    </div>

</section>

<section class="more" id="info">
    <div class="info">
        <h2>Contact Information</h2>

        <p>Email:</p>
        <p>
            <a href="mailto:your@email.com">
                your@email.com
            </a>
        </p>

        <br>

        <p>Instagram:</p>
        <p>
            <a href="https://instagram.com/username">
                @username
            </a>
        </p>

        <br>

        <p>
            Thank you for your patience.
        </p>
    </div>
</section>

<script>
function toggleMode(){
    document.body.classList.toggle("light");

    const btn=document.querySelector(".toggle");

    if(document.body.classList.contains("light")){
        btn.innerHTML="☀️";
    }else{
        btn.innerHTML="🌙";
    }
}
</script>

</body>
</html>
