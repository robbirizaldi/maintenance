<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robbi Rizaldi</title>
    
    <!-- Font Modern: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <!-- Ikon: FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- TEMA & WARNA (Pastel Mewah) --- */
        :root {
            --bg-color: #F9F6F0; /* Krem Pastel Mewah */
            --text-color: #3A3A3A;
            --btn-bg: #EAE0D5; /* Cokelat/Rose Pastel */
            --btn-hover: #D5C7BC;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --shadow-active: rgba(0, 0, 0, 0.25);
            --header-border: rgba(0, 0, 0, 0.05);
            
            /* Variabel Baru untuk Frame/Box */
            --frame-bg: rgba(255, 255, 255, 0.4);
            --frame-border: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-color: #1A1A1A; /* Hitam Elegan */
            --text-color: #F9F6F0;
            --btn-bg: #2D2D2D;
            --btn-hover: #3D3D3D;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --shadow-active: rgba(0, 0, 0, 0.5);
            --header-border: rgba(255, 255, 255, 0.05);
            
            /* Variabel Baru untuk Frame/Box Mode Gelap */
            --frame-bg: rgba(255, 255, 255, 0.03);
            --frame-border: rgba(255, 255, 255, 0.08);
        }

        /* --- GLOBAL (Disable Copy) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* Disable Block/Copy text */
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid var(--header-border);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        #theme-toggle {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-color);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #theme-toggle:hover {
            transform: scale(1.1);
        }

        /* --- BODY / MAIN KONTEN --- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* --- FRAME BOX UNTUK TOMBOL --- */
        .links-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            background-color: var(--frame-bg);
            border: 1px solid var(--frame-border);
            border-radius: 24px;
            backdrop-filter: blur(10px); /* Efek blur modern */
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .extra-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s ease-in-out;
        }

        .extra-wrapper.show {
            grid-template-rows: 1fr;
        }

        .extra-inner {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 0;
            transition: padding-top 0.4s ease-in-out;
        }

        .extra-wrapper.show .extra-inner {
            padding-top: 20px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 25px;
            background-color: var(--btn-bg);
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background-color: var(--btn-hover);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px var(--shadow-color);
        }

        /* Efek Animasi Memutar & Shadow Saat Diklik */
        .link-btn:active {
            transform: translateY(2px) rotate(3deg) scale(0.96);
            box-shadow: 0 12px 25px var(--shadow-active);
        }

        .link-btn i {
            font-size: 1.3rem;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 25px 20px;
            font-size: 0.85rem;
            font-weight: 300;
            opacity: 0.7;
        }
    </style>
</head>
<!-- Disable Klik Kanan di tag body -->
<body oncontextmenu="return false;">

    <!-- Header -->
    <header>
        <h1>robbi rizaldi</h1>
        <button id="theme-toggle" title="Ganti Tema">
            <i class="fas fa-moon" id="theme-icon"></i>
        </button>
    </header>

    <!-- Body -->
    <main>
        <!-- Wadah Frame Tipis -->
        <div class="links-container">
            <div class="links-wrapper">
                <!-- Tombol Email -->
                <a href="mailto:URL_EMAIL_KAMU@gmail.com" target="_blank" rel="noopener noreferrer" class="link-btn">
                    <i class="fas fa-envelope"></i> Email
                </a>
                
                <!-- Tombol Instagram -->
                <a href="https://instagram.com/URL_INSTAGRAM_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                
                <!-- Tombol GitHub -->
                <a href="https://github.com/URL_GITHUB_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                    <i class="fab fa-github"></i> GitHub
                </a>

                <!-- Tombol Toggle More -->
                <button id="toggle-more-btn" class="link-btn">
                    <span id="toggle-text">Click to more</span> <i class="fas fa-plus" id="toggle-btn-icon"></i>
                </button>
            </div>

            <!-- Wadah Extra Link (Tersembunyi secara default) -->
            <div id="extra-links" class="extra-wrapper">
                <div class="extra-inner">
                    <a href="https://linkedin.com/in/URL_LINKEDIN_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <i class="fab fa-linkedin"></i> LinkedIn
                    </a>
                    <a href="https://twitter.com/URL_TWITTER_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <i class="fab fa-x-twitter"></i> Twitter
                    </a>
                    <a href="https://threads.net/@URL_THREADS_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <i class="fab fa-threads"></i> Threads
                    </a>
                    <a href="https://facebook.com/URL_FACEBOOK_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <i class="fab fa-facebook"></i> Facebook
                    </a>
                    <a href="https://youtube.com/c/URL_YOUTUBE_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <i class="fab fa-youtube"></i> YouTube
                    </a>
                    <a href="https://soundcloud.com/URL_SOUNDCLOUD_KAMU" target="_blank" rel="noopener noreferrer" class="link-btn">
                        <i class="fab fa-soundcloud"></i> SoundCloud
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; <span id="year"></span> sponsored by gemini, github, cloudflare, idwebhost
    </footer>

    <!-- --- JAVASCRIPT --- -->
    <script>
        // 1. Logika Auto Tahun pada Footer
        document.getElementById("year").textContent = new Date().getFullYear();

        // 2. Logika Toggle Mode Gelap / Terang
        const themeToggleBtn = document.getElementById("theme-toggle");
        const themeIcon = document.getElementById("theme-icon");
        const body = document.body;

        // Cek preferensi tema sebelumnya jika ada
        const currentTheme = localStorage.getItem("theme");
        if (currentTheme === "dark") {
            body.setAttribute("data-theme", "dark");
            themeIcon.classList.replace("fa-moon", "fa-sun");
        }

        themeToggleBtn.addEventListener("click", () => {
            if (body.getAttribute("data-theme") === "dark") {
                body.removeAttribute("data-theme");
                themeIcon.classList.replace("fa-sun", "fa-moon");
                localStorage.setItem("theme", "light");
            } else {
                body.setAttribute("data-theme", "dark");
                themeIcon.classList.replace("fa-moon", "fa-sun");
                localStorage.setItem("theme", "dark");
            }
        });

        // 3. Logika Tombol "Click to more"
        const toggleMoreBtn = document.getElementById("toggle-more-btn");
        const extraLinks = document.getElementById("extra-links");
        const toggleText = document.getElementById("toggle-text");
        const toggleBtnIcon = document.getElementById("toggle-btn-icon");

        toggleMoreBtn.addEventListener("click", () => {
            extraLinks.classList.toggle("show");
            if (extraLinks.classList.contains("show")) {
                toggleText.textContent = "Show less";
                toggleBtnIcon.classList.replace("fa-plus", "fa-minus");
            } else {
                toggleText.textContent = "Click to more";
                toggleBtnIcon.classList.replace("fa-minus", "fa-plus");
            }
        });

        // 4. Tambahan Proteksi Keamanan via JavaScript (Opsional tapi memperkuat)
        document.addEventListener("keydown", function(e) {
            // Disable Ctrl+U (View Source), Ctrl+C (Copy), F12 (Inspect Element)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 'c' || e.key === 'C')) {
                e.preventDefault();
            }
            if (e.key === 'F12') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
